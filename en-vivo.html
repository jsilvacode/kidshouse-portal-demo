<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f7ee">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Cámaras en vivo · Kids House</title>
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script src="en-vivo.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Ir al contenido</a>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a href="./" class="brand" aria-label="Kids House, inicio">
        <img class="live-logo" src="assets/icon.png" width="56" height="56" alt="">
        <span class="brand-caption">Guardería integral<br>After school</span>
      </a>
      <a class="nav-link" href="./">Volver al portal</a>
    </div>
  </header>
  <main class="shell live-review" id="contenido" tabindex="-1">
    <h1>Cámaras en vivo</h1>
    <p>Vista perimetral de Kids House</p>
    <p id="live-message" role="status">Abre el enlace privado de la prueba para ver las cámaras.</p>
    <iframe id="live-frame" class="live-frame" title="Visor privado de las cámaras de Kids House"
      referrerpolicy="no-referrer" sandbox="allow-forms allow-scripts allow-same-origin"
      allow="autoplay; fullscreen" hidden></iframe>
  </main>
</body>
</html>
